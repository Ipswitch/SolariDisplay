<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Local Solari Display | SolariDisplay Example</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../build/SolariBoard.css" />
    <link rel="stylesheet" href="local-solari-display.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <h1>Solari Board</h1>
        <p>Type a message and watch it flip.</p>
      </header>
      <main class="main">
        <div class="board-header" aria-label="Board header">
          <span class="board-header-title">Foreign Exchange Board</span>
          <span class="board-header-subtitle">Live exchange rates</span>
        </div>
        <div id="board" class="solari-board"></div>
        <form id="message-form" class="message-form">
          <label for="message-input">Message</label>
          <textarea id="message-input" rows="3" placeholder="WELCOME ABOARD&#10;NEXT LINE"></textarea>
          <button type="submit">Update</button>
          <div class="speed-control">
            <label for="speed-input">Speed</label>
            <button type="button" id="speed-decrease">-</button>
            <input
              id="speed-input"
              type="number"
              min="0.25"
              max="8"
              step="0.25"
              value="4"
            />
            <button type="button" id="speed-increase">+</button>
          </div>
          <div class="height-control">
            <label for="height-input">Height</label>
            <button type="button" id="height-decrease">-</button>
            <input
              id="height-input"
              type="number"
              min="15"
              max="180"
              step="5"
              value="50"
            />
            <button type="button" id="height-increase">+</button>
          </div>
          <div class="theme-control">
            <label for="theme-input">Theme</label>
            <select id="theme-input">
              <option value="original" selected>Original</option>
              <option value="amber">Old Amber</option>
              <option value="modern">Modern</option>
              <option value="vintage">Vintage</option>
              <option value="steampunk">Steampunk</option>
            </select>
          </div>
          <div class="mode-control">
            <label for="mode-input">Display</label>
            <select id="mode-input">
              <option value="splitflap" selected>Split Flap</option>
              <option value="nixie">Nixie</option>
              <option value="panaplex7">Panaplex 7</option>
              <option value="panaplex14">Panaplex 14</option>
            </select>
          </div>
          <div class="playback-control">
            <label>Playback</label>
            <label>
              <input type="radio" name="playback-mode" value="all-at-once" checked />
              All at once
            </label>
            <label>
              <input type="radio" name="playback-mode" value="sequential" />
              Sequential (1.5s apart)
            </label>
          </div>
          <div class="sound-control">
            <label>
              <input type="checkbox" id="sound-toggle" checked />
              Sound
            </label>
          </div>
        </form>
      </main>
    </div>

    <script src="../build/SolariBoard.min.js"></script>
    <script type="module" src="local-solari-display.js"></script>
  </body>
</html>
